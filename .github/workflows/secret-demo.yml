name: Secret Demo

on: workflow_dispatch

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    environment: Test

    steps:
      - name: Tester la lecture et le masque du secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Erreur : DEMO_TOKEN est vide"
            exit 1
          fi

          echo "Longueur : ${#DEMO_TOKEN} caractères"

          echo "Affichage du secret : $DEMO_TOKEN"

          echo "Variable APP_ENV : ${{ vars.APP_ENV }}"
