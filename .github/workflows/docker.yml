name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-fail-under=80

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Préparer le nom du dépôt et la version
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées Docker (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.repo }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Construire et pousser l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.prep.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image du commit en Staging
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LOWER}:sha-${GITHUB_SHA::7}"
          docker run -d -p 8000:8000 --name staging-app $IMAGE_TAG

      - name: Test de fumée (Smoke Test)
        run: |
          for i in {1..10}; do
            if curl -s -f http://localhost:8000/health && curl -s -f http://localhost:8000/version; then
              echo "L'application réagit correctement !"
              exit 0
            fi
            echo "En attente du démarrage (essai $i/10)..."
            sleep 2
          done
          echo "Échec du test de fumée sur staging !"
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image de la release en Production
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_TAG="ghcr.io/${REPO_LOWER}:${VERSION}"
          docker run -d -p 8000:8000 --name prod-app $IMAGE_TAG

      - name: Test de fumée (Smoke Test)
        run: |
          for i in {1..10}; do
            if curl -s -f http://localhost:8000/health && curl -s -f http://localhost:8000/version; then
              echo "L'application en production réagit correctement !"
              exit 0
            fi
            echo "En attente du démarrage en production (essai $i/10)..."
            sleep 2
          done
          echo "Échec du test de fumée en production !"
          exit 1
